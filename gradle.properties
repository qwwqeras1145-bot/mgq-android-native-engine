# Gradle needs a full JDK. The DSH session runs with JAVA_HOME unset (the `java` on PATH is a
# JRE shim), so pin it here. Override with -Dorg.gradle.java.home=... if your JDK lives elsewhere.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# The Android Gradle Plugin refuses to build from a path containing non-ASCII characters and this
# project legitimately lives under D:\开源项目\... . The check is a warning about a class of Windows
# toolchain bugs, not a hard limitation; Kotlin/Java compilation and aapt2 packaging both work.
# Reproducibility is improved by keeping the checkout ASCII-only, so CI checks out to an ASCII path
# and does not need this flag.
android.overridePathCheck=true

android.useAndroidX=true
android.nonTransitiveRClass=true
